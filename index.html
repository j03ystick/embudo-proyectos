<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embudo de Proyectos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="contenedor">
    <header>
      <h1 id="titulo">Embudo de Proyectos</h1>
      <p id="actualizado"></p>
      <div class="resumen" id="resumen"></div>
    </header>

    <!-- Botones para elegir cómo agrupar y en qué orden -->
    <div class="controles">
      <div class="control">
        <span class="etiqueta">Agrupar por:</span>
        <div class="botones" id="botonesAgrupar"></div>
      </div>
      <div class="control">
        <span class="etiqueta">Orden:</span>
        <div class="botones" id="botonesOrden">
          <button data-orden="mayor">Mayor a menor</button>
          <button data-orden="menor">Menor a mayor</button>
        </div>
      </div>
    </div>

    <!-- Aquí se dibuja el embudo -->
    <div class="embudo" id="embudo"></div>
    <p class="ayuda">Haz clic en una barra para ver solo sus proyectos. Clic otra vez para ver todos.</p>

    <!-- Aquí se dibujan las listas de proyectos -->
    <div class="listas" id="listas"></div>
  </div>

  <script>
    // Colores que se usan cuando el grupo no tiene color propio (por ejemplo, cada coordinador)
    var PALETA = ["#5B8DEF", "#7A6FE0", "#E0A030", "#E07040", "#3BA272", "#D45087", "#2CA6B0", "#8C6D46", "#6B7A8F", "#B85FC2"];
    var COLOR_SIN_DATO = "#9CA3AF";

    // Lo que el usuario eligió en pantalla
    var estado = {
      agruparPor: "etapa",     // campo por el que se agrupa
      orden: "mayor",          // "mayor" = ancho arriba; "menor" = angosto arriba
      seleccionado: null       // grupo en el que se hizo clic
    };
    var datos = null;

    // 1) Leemos los datos del archivo projects.json
    fetch("projects.json?v=" + Date.now())
      .then(function (respuesta) { return respuesta.json(); })
      .then(function (json) { datos = json; iniciar(); })
      .catch(function () {
        document.getElementById("listas").innerHTML =
          '<div class="error">No se pudo leer projects.json. Revisa que el archivo exista y no tenga errores (comas, comillas).</div>';
      });

    function iniciar() {
      document.getElementById("titulo").textContent = datos.titulo || "Embudo de Proyectos";
      document.title = datos.titulo || "Embudo de Proyectos";
      if (datos.actualizado) {
        document.getElementById("actualizado").textContent = "Datos actualizados al " + datos.actualizado;
      }
      document.getElementById("resumen").innerHTML =
        "Total de proyectos: <strong>" + datos.proyectos.length + "</strong>";

      // Botones de "Agrupar por" (salen de "agrupar_por" en projects.json)
      var opciones = datos.agrupar_por || [{ campo: "etapa", titulo: "Etapa" }];
      estado.agruparPor = opciones[0].campo;
      var cont = document.getElementById("botonesAgrupar");
      opciones.forEach(function (op) {
        var b = document.createElement("button");
        b.textContent = op.titulo;
        b.dataset.campo = op.campo;
        b.onclick = function () { estado.agruparPor = op.campo; estado.seleccionado = null; dibujarTodo(); };
        cont.appendChild(b);
      });

      // Botones de "Orden"
      document.querySelectorAll("#botonesOrden button").forEach(function (b) {
        b.onclick = function () { estado.orden = b.dataset.orden; dibujarTodo(); };
      });

      dibujarTodo();
    }

    // 2) Armamos los grupos: cada grupo tiene nombre, color y su lista de proyectos
    function armarGrupos() {
      var campo = estado.agruparPor;
      var grupos = [];
      var porNombre = {};

      function agregarGrupo(nombre, color) {
        if (porNombre[nombre]) return;              // evita grupos repetidos
        porNombre[nombre] = { nombre: nombre, color: color, proyectos: [] };
        grupos.push(porNombre[nombre]);
      }

      // Si agrupamos por etapa, usamos el orden y colores de "etapas" en projects.json
      if (campo === "etapa") {
        (datos.etapas || []).forEach(function (e) { agregarGrupo(e.nombre, e.color); });
      }

      datos.proyectos.forEach(function (p) {
        var valor = (p[campo] || "").toString().trim();
        var nombre = valor || "Sin " + campo;
        // Una etapa escrita en un proyecto pero que no existe en "etapas" se marca para que se note
        if (campo === "etapa" && valor && !porNombre[nombre]) nombre = valor + " (no está en la lista de etapas)";
        agregarGrupo(nombre, null);
        porNombre[nombre].proyectos.push(p);
      });

      if (campo === "etapa") {
        // Las etapas mantienen su orden; "menor a mayor" las pone al revés
        if (estado.orden === "menor") grupos.reverse();
      } else {
        // Otros campos (coordinador, etc.) se ordenan por cantidad de proyectos
        grupos.sort(function (a, b) {
          var dif = b.proyectos.length - a.proyectos.length;
          if (estado.orden === "menor") dif = -dif;
          return dif !== 0 ? dif : a.nombre.localeCompare(b.nombre, "es");
        });
      }

      // Colores para los grupos que no tienen uno propio
      var i = 0;
      grupos.forEach(function (g) {
        if (!g.color) g.color = /^Sin |no está en la lista/.test(g.nombre) ? COLOR_SIN_DATO : PALETA[i++ % PALETA.length];
      });
      return grupos;
    }

    function dibujarTodo() {
      document.querySelectorAll("#botonesAgrupar button").forEach(function (b) {
        b.classList.toggle("activo", b.dataset.campo === estado.agruparPor);
      });
      document.querySelectorAll("#botonesOrden button").forEach(function (b) {
        b.classList.toggle("activo", b.dataset.orden === estado.orden);
      });
      var grupos = armarGrupos();
      dibujarEmbudo(grupos);
      dibujarListas(grupos);
    }

    // 3) Una barra por grupo; en "mayor a menor" la de arriba es la más ancha
    function dibujarEmbudo(grupos) {
      var embudo = document.getElementById("embudo");
      embudo.innerHTML = "";
      var total = grupos.length;

      grupos.forEach(function (g, i) {
        var paso = 55 / Math.max(total - 1, 1);
        var ancho = estado.orden === "mayor" ? 100 - i * paso : 45 + i * paso;   // entre 45% y 100%

        var barra = document.createElement("button");
        barra.className = "etapa";
        if (estado.orden === "menor") barra.classList.add("invertida");
        if (estado.seleccionado && estado.seleccionado !== g.nombre) barra.classList.add("apagada");
        barra.style.width = ancho + "%";
        barra.style.background = g.color;
        barra.innerHTML = '<span class="nombre"></span><span class="cantidad">' + g.proyectos.length + "</span>";
        barra.querySelector(".nombre").textContent = g.nombre;

        barra.onclick = function () {
          estado.seleccionado = (estado.seleccionado === g.nombre) ? null : g.nombre;
          dibujarTodo();
        };
        embudo.appendChild(barra);
      });
    }

    // 4) Debajo, una columna por grupo con la lista de sus proyectos
    function dibujarListas(grupos) {
      var listas = document.getElementById("listas");
      listas.innerHTML = "";
      // En cada proyecto mostramos los datos que NO son el campo por el que agrupamos
      var otros = ["etapa", "coordinador", "area"].filter(function (c) { return c !== estado.agruparPor; });

      grupos.forEach(function (g) {
        if (estado.seleccionado && estado.seleccionado !== g.nombre) return;

        var columna = document.createElement("div");
        columna.className = "columna";

        var titulo = document.createElement("h2");
        titulo.style.background = g.color;
        titulo.textContent = g.nombre + " (" + g.proyectos.length + ")";
        columna.appendChild(titulo);

        var lista = document.createElement("ul");
        if (g.proyectos.length === 0) {
          lista.innerHTML = '<li class="vacio">Sin proyectos</li>';
        }
        g.proyectos.forEach(function (p) {
          var item = document.createElement("li");
          var nombre = document.createElement("div");
          nombre.textContent = p.nombre;
          var detalle = document.createElement("div");
          detalle.className = "detalle";
          detalle.textContent = otros.map(function (c) { return p[c]; }).filter(Boolean).join(" · ");
          item.appendChild(nombre);
          item.appendChild(detalle);
          lista.appendChild(item);
        });
        columna.appendChild(lista);
        listas.appendChild(columna);
      });
    }
  </script>
</body>
</html>
